<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Beacon Lost Property Desk{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
<div class="site-header__inner">
<div class="site-brand">
<p class="brand">Beacon</p>
<ul class="runway-lights" aria-hidden="true">
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
<li></li>
</ul>
</div>
<nav class="site-nav" aria-label="Main">
<ul>
<li><a href="/dashboard">Dashboard</a></li>
<li><a href="/records">Records</a></li>
<li><a href="/records/new">Log item</a></li>
</ul>
</nav>
<div class="header-actions">
<button type="button" id="effects-toggle" class="button button-secondary" aria-pressed="true">Effects <span id="effects-state" aria-hidden="true">on</span></button>
<button type="button" id="sign-out" class="button button-secondary">Sign out</button>
</div>
</div>
</header>
<main id="main" class="page" tabindex="-1">
<h1 id="page-heading" tabindex="-1">{% block heading %}Beacon Lost Property Desk{% endblock %}</h1>
{% block content %}{% endblock %}
<p id="live-status" class="visually-hidden" role="status" aria-live="polite"></p>
</main>
<footer class="site-footer">
<div class="site-footer__inner">
<p>Beacon Lost Property Desk. Airport terminal services</p>
</div>
</footer>
<script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
